name: Build and release frontend
 
on:
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/frontend-ci.yml"
 
permissions:
  contents: write   # nécessaire pour commit/push le manifeste mis à jour
 
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Build and push l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
 
      # ÉTAPE GITOPS — c'est cette étape, pas kubectl, qui déclenche le
      # déploiement : ArgoCD surveille ce fichier et synchronise dès
      # qu'il change.
      - name: Mettre à jour le tag d'image dans le manifeste
        run: |
          sed -i "s|image: .*/frontend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}|" \
            deployment.yaml
 
      - name: Commit et push le manifeste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment.yaml
          git diff --staged --quiet && echo "Rien à committer" && exit 0
          git commit -m "ci: déploiement frontend ${{ github.sha }}"
          git push
